[project]
name = "mp4-py"
version = "2026.1.0"
description = "Python bindings for shiguredo/mp4-rs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Rust",
]
dependencies = []

[project.urls]
Discord = "https://discord.gg/shiguredo"
Source = "https://github.com/shiguredo/mp4-py"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["hypothesis", "pytest", "pytest-timeout"]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/experimental-inspect"]
manifest-path = "Cargo.toml"
# 拡張モジュールは Python パッケージ mp4 内の mp4_ext として配置する。
module-name = "mp4.mp4_ext"
python-source = "python"

[tool.pytest.ini_options]
# Property-Based Testing (PBT) は prop_ prefix を使用する
python_files = ["test_*.py", "prop_*.py"]
python_functions = ["test_*", "prop_*"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
