[project]
name = "mp4-py"
description = "Python bindings for mp4-rust"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Discord = "https://discord.gg/shiguredo"
Source = "https://github.com/shiguredo/mp4-py"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["hypothesis", "pytest", "pytest-timeout"]

[build-system]
requires = ["nanobind>=2.13.0", "scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.pytest.ini_options]
# Property-Based Testing (PBT) は prop_ prefix を使用する
python_files = ["test_*.py", "prop_*.py"]
python_functions = ["test_*", "prop_*"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.scikit-build]
minimum-version = "0.12.2"
sdist.include = ["VERSION"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.2"
args = ["-DCMAKE_BUILD_TYPE=Release"]
define = { "CMAKE_CXX_STANDARD" = "20" }

[tool.scikit-build.wheel]
packages = ["src/mp4"]
expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
