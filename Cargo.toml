[package]
name = "mp4-py"
version = "2026.1.0"
edition = "2024"
publish = false

[lib]
# Python 拡張モジュールとして cdylib を生成する
name = "mp4_ext"
crate-type = ["cdylib"]

[dependencies]
# crates.io 公開版の shiguredo_mp4 (Rust クレート) を使う。
shiguredo_mp4 = "2026.3.0"
# PyO3 0.29 は Free-Threading (Py_GIL_DISABLED) の Python 3.14+ に対応。
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312", "experimental-inspect"] }

[build-dependencies]
# shiguredo_mp4 の実際に使われている pin バージョンを Cargo.lock から解決するため。
cargo_metadata = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
